function walk(p,create){const ks=p.split('.');let c=S;for(let i=0;i<ks.length-1;i++){const k=ks[i];let n;if(Array.isArray(c))n=c.find(x=>x.id===k);else{n=c[k];if(n==null&&create)n=c[k]={}}if(n==null)return null;c=n}return[c,ks[ks.length-1]]}
const getP=p=>{const r=walk(p,false);if(!r)return'';const[c,k]=r;if(Array.isArray(c))return'';const v=c[k];return v==null?'':v};
const setP=(p,v)=>{const r=walk(p,true);if(!r)return;const[c,k]=r;if(!Array.isArray(c))c[k]=v};

 save();render();renderModal()});
